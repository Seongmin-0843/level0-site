<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOCK DROP — LEVEL 0 데모</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<!--
  사이트의 플레이 화면 동작을 확인하기 위한 데모 게임입니다.
  Unity WebGL 빌드도 이 파일처럼 "폴더 안의 index.html" 형태라서 똑같이 연결됩니다.
-->
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 960, H = 540;              // 논리 해상도 (16:9)
  const ACCENT = '#d4ff3a';
  let scale = 1, keys = {}, touchDir = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    scale = Math.min(cv.width / W, cv.height / H);
  }
  addEventListener('resize', resize); resize();

  let player, blocks, t, score, best = 0, state = 'ready', spawn;
  function reset() {
    player = { x: W / 2, w: 34, h: 34, vx: 0 };
    blocks = []; t = 0; score = 0; spawn = 0;
  }
  reset();

  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') { e.preventDefault(); if (state !== 'play') { reset(); state = 'play'; } }
    if (state === 'ready' && /Arrow|Key[AD]/.test(e.code)) state = 'play';
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') { reset(); state = 'play'; return; }
    touchDir = e.clientX < innerWidth / 2 ? -1 : 1;
  });
  addEventListener('pointerup', () => touchDir = 0);

  function update(dt) {
    if (state !== 'play') return;
    t += dt; score += dt * 10;
    const dir = (keys.ArrowLeft || keys.KeyA ? -1 : 0) + (keys.ArrowRight || keys.KeyD ? 1 : 0) + touchDir;
    player.vx += dir * 2600 * dt; player.vx *= Math.pow(0.0008, dt);
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x + player.vx * dt));

    spawn -= dt;
    const level = 1 + t / 12;
    if (spawn <= 0) {
      const w = 40 + Math.random() * 90;
      blocks.push({ x: Math.random() * (W - w), y: -60, w, h: 22 + Math.random() * 18,
                    vy: (180 + Math.random() * 140) * level, rot: (Math.random() - .5) * .9,
                    hollow: Math.random() < .3 });
      spawn = Math.max(0.12, 0.55 / level);
    }
    const py = H - 60;
    for (const b of blocks) {
      b.y += b.vy * dt;
      if (b.x < player.x + player.w / 2 - 4 && b.x + b.w > player.x - player.w / 2 + 4 &&
          b.y < py + player.h / 2 && b.y + b.h > py - player.h / 2 + 4) {
        state = 'over'; best = Math.max(best, Math.floor(score));
      }
    }
    blocks = blocks.filter(b => b.y < H + 80);
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0b0b0c'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(scale, 0, 0, scale, (cv.width - W * scale) / 2, (cv.height - H * scale) / 2);

    // 배경 격자
    ctx.fillStyle = '#121214'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // 블록 (로고처럼 기울어진 막대 + 속이 빈 사각형)
    for (const b of blocks) {
      ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.rotate(b.rot);
      if (b.hollow) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h); }
      else { ctx.fillStyle = '#fff'; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); }
      ctx.restore();
    }
    // 바닥 & 플레이어
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, H - 38, W, 2);
    ctx.save(); ctx.translate(player.x, H - 60); ctx.rotate(Math.PI / 4 + player.vx * 0.0004);
    ctx.fillStyle = ACCENT; ctx.fillRect(-player.h / 2, -player.h / 2, player.h, player.h); ctx.restore();

    // UI
    ctx.font = '700 22px system-ui, sans-serif'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText('SCORE ' + Math.floor(score), 24, 20);
    ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillText('BEST ' + best, W - 24, 20);

    if (state !== 'play') {
      ctx.fillStyle = 'rgba(11,11,12,.72)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = state === 'over' ? ACCENT : '#fff';
      ctx.font = '900 64px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'GAME OVER' : 'BLOCK DROP', W / 2, H / 2 - 30);
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '500 20px system-ui, sans-serif';
      ctx.fillText(state === 'over' ? 'SPACE 또는 클릭으로 다시 시작' : '← → 로 이동 · SPACE 또는 클릭으로 시작', W / 2, H / 2 + 34);
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
